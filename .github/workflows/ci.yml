name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  check:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint & type-check
        id: lint
        run: npm run lint

      - name: Tests
        id: test
        run: npm test

      - name: Build
        id: build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const results = [
              { step: 'Lint & type-check', id: 'lint',  outcome: '${{ steps.lint.outcome }}' },
              { step: 'Tests',             id: 'test',  outcome: '${{ steps.test.outcome }}' },
              { step: 'Build',             id: 'build', outcome: '${{ steps.build.outcome }}' },
            ];

            const icon = (o) => o === 'success' ? '✅' : o === 'failure' ? '❌' : '⏭️';
            const rows = results.map(r => `| ${icon(r.outcome)} | ${r.step} |`).join('\n');
            const allPassed = results.every(r => r.outcome === 'success');

            const body = [
              `## CI ${allPassed ? '✅ Passed' : '❌ Failed'}`,
              '',
              '| | Step |',
              '|---|---|',
              rows,
              '',
              `> Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.startsWith('## CI')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
